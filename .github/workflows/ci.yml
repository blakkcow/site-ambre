name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typage du site
        run: npx tsc --noEmit -p .
      - name: Typage des fonctions Convex
        run: npx tsc --noEmit -p convex
      - name: Audit des dépendances (critique uniquement, Next 14 en attente de migration)
        run: npm audit --omit=dev --audit-level=critical || echo "::warning::Vulnérabilités connues — voir npm audit"
